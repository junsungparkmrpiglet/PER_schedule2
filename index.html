<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>응급실 근무표</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --paper:#F7F7F5; --card:#FFFFFF; --ink:#1C1C1A; --mid:#6B6B66; --faint:#9A9A94;
  --line:#E3E3DC; --line-2:#CFCFC6;
  --d-fg:#8A5A0F; --d-bg:#FAF0DC; --d-br:#E8D2A4;
  --e-fg:#A8431F; --e-bg:#FAE9E1; --e-br:#EEC5B2;
  --n-fg:#33417A; --n-bg:#E7EAF7; --n-br:#BFC7E6;
  --o-fg:#146653; --o-bg:#DEF0EB; --o-br:#A8D6C8;
  --rest:#F0F0EA; --r:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  background:var(--paper); color:var(--ink); font-size:14px; line-height:1.5;
  font-feature-settings:'tnum' 1;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.topbar{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--faint);font-weight:400;margin-left:6px;font-size:12px}
.spacer{flex:1}
.who{display:flex;align-items:center;gap:6px}
.who label{font-size:12px;color:var(--mid)}
select.picker{border:1px solid var(--line-2);border-radius:var(--r);padding:5px 26px 5px 9px;
  background:var(--card);appearance:none;font-size:13px;font-weight:500;
  background-image:linear-gradient(45deg,transparent 50%,var(--mid) 50%),linear-gradient(135deg,var(--mid) 50%,transparent 50%);
  background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.tabs{display:flex;gap:2px;background:var(--card);border-bottom:1px solid var(--line);padding:0 16px;overflow-x:auto}
.tabs button{padding:9px 14px;font-size:13px;font-weight:500;color:var(--mid);
  border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}

main{padding:16px;max-width:1120px;margin:0 auto}
.panel[hidden]{display:none}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.h{font-size:15px;font-weight:600;letter-spacing:-.01em}
.h2{font-size:13px;font-weight:600;margin-bottom:8px}
.sub{font-size:12px;color:var(--mid)}
.btn{border:1px solid var(--line-2);border-radius:var(--r);padding:6px 11px;font-size:13px;background:var(--card)}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stub{color:var(--mid);font-size:13px;padding:28px 16px;text-align:center;border:1px dashed var(--line-2);border-radius:10px}

.calwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.cal{min-width:672px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.dow div{font-size:11px;font-weight:500;color:var(--mid);text-align:center;padding:2px 0}
.dow .sat{color:#33417A} .dow .sun{color:#A8431F}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:3px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:5px 5px 6px;min-height:96px}
.day.holi{background:#FDFBF6;border-color:#EADFC8}
.dnum{font-size:11px;font-weight:600;color:var(--mid);display:flex;gap:5px;align-items:baseline;margin-bottom:4px}
.dnum .hname{font-weight:400;font-size:10px;color:#A8431F;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot{display:flex;align-items:center;gap:4px;width:100%;text-align:left;
  font-size:11.5px;line-height:1.45;border-radius:3px;padding:1px 3px;margin:0 -3px}
.slot .tag{flex:none;width:15px;text-align:center;font-size:10px;font-weight:700;border-radius:2px;border:1px solid}
.slot .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.slot.empty .nm{color:var(--faint)}
.slot.me{background:var(--ink)}
.slot.me .nm{color:var(--paper);font-weight:600}
.slot.me .tag{background:var(--paper)}
.slot.pick{outline:2px solid var(--ink);outline-offset:1px}
.slot.cand{background:#FFF6D9;box-shadow:inset 0 0 0 1.5px #C99A16;border-radius:3px}
.slot.cand .nm{font-weight:600}
.t-D{color:var(--d-fg);background:var(--d-bg);border-color:var(--d-br)}
.t-E{color:var(--e-fg);background:var(--e-bg);border-color:var(--e-br)}
.t-N{color:var(--n-fg);background:var(--n-bg);border-color:var(--n-br)}
.t-O{color:var(--o-fg);background:var(--o-bg);border-color:var(--o-br)}
.t-x{color:var(--mid);background:var(--rest);border-color:var(--line-2)}
.dim .slot:not(.me):not(.cand) .nm{color:var(--faint)}

.list{display:flex;flex-direction:column;gap:3px}
.lrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:start;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:7px 10px}
.lrow.holi{background:#FDFBF6;border-color:#EADFC8}
.ldate{font-size:12px;font-weight:600;color:var(--mid)}
.ldate em{display:block;font-style:normal;font-weight:400;font-size:10px;color:#A8431F}
.lslots{display:flex;flex-wrap:wrap;gap:4px 10px}

.notice{border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--mid)}
.notice strong{color:var(--ink);font-weight:600}
.notice code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:var(--rest);padding:1px 5px;border-radius:3px}
.err{border-color:#EEC5B2;background:#FAE9E1;color:#A8431F}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--mid);margin-top:10px}
.legend b{font-weight:500;color:var(--ink)}

/* 교체 */
.swapgrid{display:grid;grid-template-columns:300px 1fr;gap:14px;align-items:start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);border-radius:var(--r);background:var(--card);
  padding:5px 9px;font-size:12.5px;display:flex;align-items:center;gap:6px}
.chip .tag{width:15px;text-align:center;font-size:10px;font-weight:700;border-radius:2px;border:1px solid}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rows{display:flex;flex-direction:column;gap:5px}
.crow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:8px 10px;font-size:13px}
.crow:hover{border-color:var(--ink)}
.crow[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.crow .who2{font-weight:600;flex:none;min-width:52px}
.crow .cnt{color:var(--mid);font-size:12px}
.crow .warn{color:#A8431F;font-size:11.5px}
.crow.no{opacity:.55}
.crow.no:hover{border-color:var(--line)}
.step{font-size:12px;color:var(--mid);margin-bottom:6px}
.step b{color:var(--ink);font-weight:600}
@media (max-width:820px){ .swapgrid{grid-template-columns:1fr} }
@media (max-width:640px){ main{padding:12px} .topbar{padding:9px 12px} .tabs{padding:0 12px} }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">응급실 근무표<span id="period"></span></div>
  <div class="spacer"></div>
  <div class="who">
    <label for="me">본인</label>
    <select id="me" class="picker"><option value="">선택</option></select>
  </div>
</div>

<div class="tabs" role="tablist">
  <button role="tab" data-tab="board" aria-selected="true">근무표</button>
  <button role="tab" data-tab="swap" aria-selected="false">교체</button>
  <button role="tab" data-tab="mine" aria-selected="false">내 일정</button>
  <button role="tab" data-tab="admin" aria-selected="false">관리자</button>
</div>

<main>
  <div id="boot"></div>

  <section class="panel" data-panel="board" hidden>
    <div class="bar">
      <div class="h">8주 근무표</div><div class="spacer"></div>
      <button class="btn" id="onlyMine" aria-pressed="false">내 근무만</button>
      <button class="btn" id="viewToggle">목록으로</button>
    </div>
    <div id="board"></div>
    <div class="legend">
      <span><b>D</b> 08–16</span><span><b>E</b> 16–23</span>
      <span><b>N</b> 23–08</span><span><b>O</b> 18–06 이중근무</span>
    </div>
  </section>

  <section class="panel" data-panel="swap" hidden>
    <div class="bar"><div class="h">근무 교체</div><div class="spacer"></div>
      <button class="btn" id="swapReset">처음부터</button></div>
    <div class="swapgrid">
      <div>
        <div class="card" style="margin-bottom:10px">
          <div class="h2">1 · 넘길 내 근무</div>
          <div id="myShifts" class="chips"></div>
        </div>
        <div class="card">
          <div class="h2">2 · 대신 설 수 있는 사람</div>
          <div id="cands" class="rows"></div>
        </div>
      </div>
      <div class="card">
        <div class="h2">3 · 받아올 근무</div>
        <div class="step" id="swapStep"></div>
        <div id="swapCal"></div>
      </div>
    </div>
  </section>

  <section class="panel" data-panel="mine" hidden>
    <div class="bar"><div class="h">희망 · 불가 일정</div></div>
    <div class="stub">기존 입력 화면을 이 자리로 옮깁니다.</div>
  </section>

  <section class="panel" data-panel="admin" hidden>
    <div class="bar"><div class="h">관리자</div></div>
    <div class="card" style="margin-bottom:10px">
      <div class="h2">스케줄</div>
      <div class="bar" style="margin:0">
        <button class="btn" id="genTemp">임시 스케줄 만들기</button>
        <button class="btn" id="clearSched">지우기</button>
        <span class="sub" id="schedInfo"></span>
      </div>
      <div class="sub" style="margin-top:8px">
        개발·확인용입니다. 규칙을 지키는 배정을 시도하지만 최적해가 아닙니다.
        완성되면 Colab CSV 업로드로 바뀝니다.
      </div>
    </div>
    <div class="stub">근무패턴 · 직원 · 설정 · 휴일 · CSV 업로드</div>
  </section>
</main>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbyNIuS3BVdFlGGHQKi_RZ4avQ5nS4yCicDn7trEymnuq3YKu4jEFtXyn0rHqs8URn8yqQ/exec';

var LS = 'er-sched-v2';
var app = {
  config:{}, patterns:[], pmap:{}, transitions:{}, staff:[], holidays:{},
  prefIdx:{}, dates:[], dateIdx:{}, byDate:{}, byPerson:{},
  me:'', onlyMine:false, view:'cal',
  pick:null, cand:null, matches:{}
};

function save(k,v){ try{ localStorage.setItem(LS+':'+k, JSON.stringify(v)); }catch(e){} }
function load(k,d){ try{ var s=localStorage.getItem(LS+':'+k); return s?JSON.parse(s):d; }catch(e){ return d; } }

/* ── 날짜 ── */
function parseISO(s){ var p=String(s).split('-'); return new Date(+p[0],+p[1]-1,+p[2]); }
function fmtISO(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function addDays(d,n){ var x=new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function shiftDate(iso,n){ return fmtISO(addDays(parseISO(iso),n)); }
function isHoliday(iso){ var w=parseISO(iso).getDay(); return w===0||w===6||!!app.holidays[iso]; }
var DOWK=['일','월','화','수','목','금','토'];
function shortDate(iso){ var d=parseISO(iso); return (d.getMonth()+1)+'/'+d.getDate()+' ('+DOWK[d.getDay()]+')'; }

/* ── 통신 ── */
function apiGet(action,params){
  var u=API_URL+'?action='+encodeURIComponent(action);
  for(var k in (params||{})) u+='&'+k+'='+encodeURIComponent(params[k]);
  return fetch(u).then(function(r){return r.json();});
}

/* ── 부팅 ── */
function boot(){
  var q=new URLSearchParams(location.search);
  if(q.get('api')) API_URL=q.get('api');
  app.me=load('me',''); app.view=load('view','cal');

  notice('불러오는 중','설정 · 근무패턴 · 직원 · 휴일 · 희망일정');
  apiGet('getBootstrap').then(function(res){
    if(!res||!res.ok) throw new Error(res&&res.error?res.error:'응답 형식 오류');
    app.config=res.config||{};
    app.patterns=res.patterns||[];
    app.transitions=res.transitions||{};
    app.staff=res.staff||[];
    app.pmap={}; app.patterns.forEach(function(p){ app.pmap[p.name]=p; });
    app.holidays={}; (res.holidays||[]).forEach(function(h){ app.holidays[h.date]=h.name; });

    app.prefIdx={};
    (res.prefs||[]).forEach(function(p){
      if(!app.prefIdx[p.name]) app.prefIdx[p.name]={};
      app.prefIdx[p.name][p.date]=p;
    });

    var start=app.config['시작일'], weeks=Number(app.config['주수']||8);
    if(!start) throw new Error('설정 시트에서 시작일을 찾지 못했습니다');
    app.dates=[]; app.dateIdx={};
    for(var i=0;i<weeks*7;i++){
      var iso=fmtISO(addDays(parseISO(start),i));
      app.dateIdx[iso]=i; app.dates.push(iso);
    }
    ready();
  }).catch(function(err){
    notice('불러오지 못했습니다', err.message, true);
  });
}

function notice(t,b,e){
  document.getElementById('boot').innerHTML=
    '<div class="notice'+(e?' err':'')+'"><strong>'+t+'</strong><br>'+b+'</div>';
}

function ready(){
  document.getElementById('boot').innerHTML='';
  document.getElementById('period').textContent=
    ' '+app.dates[0]+' → '+app.dates[app.dates.length-1];

  var sel=document.getElementById('me');
  app.staff.forEach(function(s){
    var o=document.createElement('option');
    o.value=s.name; o.textContent=s.name+(s.role==='진료교수'?' (진료교수)':'');
    sel.appendChild(o);
  });
  if(app.me) sel.value=app.me;

  indexSchedule(load('schedule',[]));
  showTab(load('tab','board'));
  renderAll();
}

/* ── 스케줄 색인 ── */
function indexSchedule(rows){
  app.rows=rows||[];
  app.byDate={}; app.byPerson={};
  app.rows.forEach(function(r){
    if(!app.byDate[r.date]) app.byDate[r.date]={};
    app.byDate[r.date][r.shift]=r.name;
    if(!app.byPerson[r.name]) app.byPerson[r.name]={};
    app.byPerson[r.name][r.date]=r.shift;
  });
}
function setSchedule(rows){ indexSchedule(rows); save('schedule',rows); }

/* ── 규칙 판정 ──────────────────────────────
   blocked : 개인 불가일정
   restOK  : 전이표 기반 앞뒤 휴게시간
   ───────────────────────────────────────── */
function blocked(name,date,shift){
  var p=(app.prefIdx[name]||{})[date];
  if(!p) return false;
  if(p.blockAll) return true;
  return (p.block||[]).indexOf(shift)>=0;
}

/**
 * name 이 (date, shift) 를 맡을 수 있는가.
 * skipKey 로 지정한 자기 근무 하나는 없는 것으로 간주합니다 (교환으로 빠질 근무).
 */
function canHold(name,date,shift,skipKey){
  if(blocked(name,date,shift)) return false;
  var mine=app.byPerson[name]||{};
  var own=function(d){
    var s=mine[d];
    if(!s) return null;
    return (d+'|'+s)===skipKey ? null : s;
  };
  if(own(date)) return false;                       // 그날 이미 근무
  for(var g=1;g<=2;g++){
    var pv=own(shiftDate(date,-g));
    if(pv && (app.transitions[pv]||{})[g].indexOf(shift)<0) return false;
    var nx=own(shiftDate(date, g));
    if(nx && (app.transitions[shift]||{})[g].indexOf(nx)<0) return false;
  }
  return true;
}

/** rolling 7일 상한 위반 여부 (경고용, 후보에서 걸러내지는 않습니다) */
function rollingBreak(name,addDate,addShift,skipKey){
  var lim=Number(app.config['rolling상한']||5), win=Number(app.config['rolling일수']||7);
  var mine=app.byPerson[name]||{};
  var has={};
  for(var d in mine) if((d+'|'+mine[d])!==skipKey) has[d]=1;
  has[addDate]=1;
  var i0=app.dateIdx[addDate];
  for(var s=Math.max(0,i0-win+1); s<=i0; s++){
    var c=0;
    for(var k=0;k<win;k++){ var dd=app.dates[s+k]; if(dd&&has[dd]) c++; }
    if(c>lim) return true;
  }
  return false;
}

/**
 * 내 근무 (date, shift) 를 넘길 때 성립하는 맞교환을 모두 찾습니다.
 * 반환: { 상대이름: [ {date, shift, warn} ... ] }
 */
function findSwaps(myDate,myShift){
  var out={}, myKey=myDate+'|'+myShift;
  app.staff.forEach(function(s){
    if(s.name===app.me) return;
    var theirs=app.byPerson[s.name]||{};
    var opts=[];
    for(var d in theirs){
      var t=theirs[d], theirKey=d+'|'+t;
      if(!canHold(s.name,myDate,myShift,theirKey)) continue;   // 상대가 내 근무를 받을 수 있나
      if(!canHold(app.me,d,t,myKey)) continue;                 // 내가 그 근무를 받을 수 있나
      opts.push({
        date:d, shift:t,
        warn: rollingBreak(s.name,myDate,myShift,theirKey) || rollingBreak(app.me,d,t,myKey)
      });
    }
    opts.sort(function(a,b){ return a.date<b.date?-1:1; });
    out[s.name]=opts;
  });
  return out;
}

/* ── 렌더 ── */
function renderAll(){ renderBoard(); renderSwap(); renderAdmin(); }

function slotHTML(iso,p,opt){
  opt=opt||{};
  var who=(app.byDate[iso]||{})[p.name]||'';
  var mine=who&&who===app.me;
  var shown=who;
  if(opt.onlyMine&&!mine) shown='';
  var cls='slot'+(mine?' me':'')+(shown?'':' empty');
  if(opt.pickKey===iso+'|'+p.name) cls+=' pick';
  if(opt.candKeys&&opt.candKeys[iso+'|'+p.name]) cls+=' cand';
  return '<button class="'+cls+'" data-date="'+iso+'" data-shift="'+p.name+'">'
       + '<span class="tag t-'+(mine?'x':p.name)+'">'+p.name+'</span>'
       + '<span class="nm">'+(shown||'·')+'</span></button>';
}

function calendarHTML(opt){
  var h='<div class="calwrap"><div class="cal"><div class="dow">'
    +'<div>월</div><div>화</div><div>수</div><div>목</div><div>금</div>'
    +'<div class="sat">토</div><div class="sun">일</div></div>';
  for(var w=0; w*7<app.dates.length; w++){
    h+='<div class="week">';
    for(var i=0;i<7;i++){
      var iso=app.dates[w*7+i];
      if(!iso){ h+='<div></div>'; continue; }
      var hn=app.holidays[iso]||'';
      h+='<div class="day'+(isHoliday(iso)?' holi':'')+(opt.onlyMine?' dim':'')+'">'
        +'<div class="dnum"><span>'+parseISO(iso).getDate()+'</span>'
        +(hn?'<span class="hname">'+hn+'</span>':'')+'</div>';
      app.patterns.forEach(function(p){ h+=slotHTML(iso,p,opt); });
      h+='</div>';
    }
    h+='</div>';
  }
  return h+'</div></div>';
}

function listHTML(opt){
  var h='<div class="list">';
  app.dates.forEach(function(iso){
    var hn=app.holidays[iso]||'';
    h+='<div class="lrow'+(isHoliday(iso)?' holi':'')+(opt.onlyMine?' dim':'')+'">'
      +'<div class="ldate">'+shortDate(iso)+(hn?'<em>'+hn+'</em>':'')+'</div><div class="lslots">';
    app.patterns.forEach(function(p){ h+=slotHTML(iso,p,opt); });
    h+='</div></div>';
  });
  return h+'</div>';
}

function renderBoard(){
  var opt={onlyMine:app.onlyMine};
  document.getElementById('board').innerHTML=
    app.view==='cal'?calendarHTML(opt):listHTML(opt);
  document.getElementById('viewToggle').textContent=app.view==='cal'?'목록으로':'캘린더로';
  document.getElementById('onlyMine').setAttribute('aria-pressed',app.onlyMine?'true':'false');
}

function renderSwap(){
  var my=document.getElementById('myShifts'),
      cd=document.getElementById('cands'),
      st=document.getElementById('swapStep'),
      cal=document.getElementById('swapCal');

  if(!app.me){
    my.innerHTML='<span class="sub">위에서 본인을 먼저 선택해 주세요.</span>';
    cd.innerHTML=''; st.textContent=''; cal.innerHTML=''; return;
  }
  var mine=app.byPerson[app.me]||{};
  var keys=Object.keys(mine).sort();
  if(!keys.length){
    my.innerHTML='<span class="sub">근무표가 아직 없습니다. 관리자 탭에서 임시 스케줄을 만들어 보세요.</span>';
    cd.innerHTML=''; st.textContent=''; cal.innerHTML=''; return;
  }

  my.innerHTML=keys.map(function(d){
    var s=mine[d], k=d+'|'+s;
    return '<button class="chip" data-key="'+k+'" aria-pressed="'+(app.pick===k)+'">'
      +'<span class="tag t-'+s+'">'+s+'</span>'+shortDate(d)+'</button>';
  }).join('');

  if(!app.pick){
    cd.innerHTML='<span class="sub">넘길 근무를 먼저 고르세요.</span>';
    st.textContent=''; cal.innerHTML=''; return;
  }

  var pk=app.pick.split('|');
  app.matches=findSwaps(pk[0],pk[1]);

  var names=app.staff.map(function(s){return s.name;}).filter(function(n){return n!==app.me;});
  names.sort(function(a,b){ return (app.matches[b]||[]).length-(app.matches[a]||[]).length; });

  cd.innerHTML=names.map(function(n){
    var o=app.matches[n]||[];
    var warned=o.filter(function(x){return x.warn;}).length;
    if(!o.length){
      return '<div class="crow no"><span class="who2">'+n+'</span>'
        +'<span class="cnt">'+whyNot(n,pk[0],pk[1])+'</span></div>';
    }
    return '<button class="crow" data-name="'+n+'" aria-pressed="'+(app.cand===n)+'">'
      +'<span class="who2">'+n+'</span><span class="cnt">'+o.length+'건 가능</span>'
      +(warned?'<span class="spacer"></span><span class="warn">주 5회 초과 '+warned+'</span>':'')
      +'</button>';
  }).join('');

  var candKeys={};
  if(app.cand && app.matches[app.cand]){
    app.matches[app.cand].forEach(function(o){ candKeys[o.date+'|'+o.shift]=1; });
    st.innerHTML='<b>'+app.cand+'</b> 님의 근무 중 내가 설 수 있는 것을 표시했습니다. '
      +'실제 교대는 근무표 시트에서 진행하세요.';
  } else {
    st.innerHTML='왼쪽에서 상대를 고르면 받아올 수 있는 근무가 표시됩니다.';
  }
  cal.innerHTML=calendarHTML({pickKey:app.pick,candKeys:candKeys});
}

/** 후보에서 빠진 이유를 한 줄로 (가장 먼저 걸리는 사유) */
function whyNot(name,date,shift){
  if(blocked(name,date,shift)) return '그날 불가 신청';
  var mine=app.byPerson[name]||{};
  for(var g=1;g<=2;g++){
    var pv=mine[shiftDate(date,-g)];
    if(pv&&(app.transitions[pv]||{})[g].indexOf(shift)<0) return shortDate(shiftDate(date,-g))+' '+pv+' 휴게';
    var nx=mine[shiftDate(date,g)];
    if(nx&&(app.transitions[shift]||{})[g].indexOf(nx)<0) return shortDate(shiftDate(date,g))+' '+nx+' 휴게';
  }
  return '맞바꿀 근무 없음';
}

function renderAdmin(){
  var n=(app.rows||[]).length;
  document.getElementById('schedInfo').textContent=
    n? n+'건 배정됨' : '비어 있음';
}

/* ── 임시 스케줄 (개발용) ── */
function generateTemp(){
  var rows=[], byPerson={}, byDate={};
  var specs=app.staff.filter(function(s){return s.role==='전문의';});
  var profs=app.staff.filter(function(s){return s.role==='진료교수';});
  var count={}; app.staff.forEach(function(s){count[s.name]=0;});

  function ok(name,date,shift){
    var p=(app.prefIdx[name]||{})[date];
    if(p&&(p.blockAll||(p.block||[]).indexOf(shift)>=0)) return false;
    var mine=byPerson[name]||{};
    if(mine[date]) return false;
    for(var g=1;g<=2;g++){
      var pv=mine[shiftDate(date,-g)];
      if(pv&&(app.transitions[pv]||{})[g].indexOf(shift)<0) return false;
      var nx=mine[shiftDate(date,g)];
      if(nx&&(app.transitions[shift]||{})[g].indexOf(nx)<0) return false;
    }
    return true;
  }
  function put(name,date,shift){
    rows.push({date:date,shift:shift,name:name});
    if(!byPerson[name]) byPerson[name]={};
    byPerson[name][date]=shift;
    if(!byDate[date]) byDate[date]={};
    byDate[date][shift]=name;
    count[name]++;
  }

  app.dates.forEach(function(iso){
    var wd=parseISO(iso).getDay();
    // 진료교수: 화(2) 목(4) 토(6) E 우선
    profs.forEach(function(pf){
      if([2,4,6].indexOf(wd)>=0 && ok(pf.name,iso,'E')) put(pf.name,iso,'E');
    });
    app.patterns.forEach(function(p){
      if((byDate[iso]||{})[p.name]) return;
      var pool=specs.filter(function(s){ return ok(s.name,iso,p.name); });
      if(!pool.length) return;
      pool.sort(function(a,b){ return count[a.name]-count[b.name]; });
      put(pool[0].name,iso,p.name);
    });
  });
  return rows;
}

/* ── 탭 ── */
function showTab(name){
  document.querySelectorAll('.tabs button').forEach(function(b){
    b.setAttribute('aria-selected', b.dataset.tab===name?'true':'false');
  });
  document.querySelectorAll('.panel').forEach(function(p){ p.hidden=p.dataset.panel!==name; });
  save('tab',name);
}

/* ── 이벤트 ── */
document.querySelector('.tabs').addEventListener('click',function(e){
  var b=e.target.closest('button[data-tab]'); if(b) showTab(b.dataset.tab);
});
document.getElementById('me').addEventListener('change',function(e){
  app.me=e.target.value; save('me',app.me);
  app.pick=null; app.cand=null; renderAll();
});
document.getElementById('onlyMine').addEventListener('click',function(){
  app.onlyMine=!app.onlyMine; renderBoard();
});
document.getElementById('viewToggle').addEventListener('click',function(){
  app.view=app.view==='cal'?'list':'cal'; save('view',app.view); renderBoard();
});
document.getElementById('board').addEventListener('click',function(e){
  var b=e.target.closest('.slot'); if(!b) return;
  var who=(app.byDate[b.dataset.date]||{})[b.dataset.shift];
  if(who && who===app.me){
    app.pick=b.dataset.date+'|'+b.dataset.shift; app.cand=null;
    showTab('swap'); renderSwap();
  }
});
document.getElementById('myShifts').addEventListener('click',function(e){
  var b=e.target.closest('.chip'); if(!b) return;
  app.pick = app.pick===b.dataset.key ? null : b.dataset.key;
  app.cand=null; renderSwap();
});
document.getElementById('cands').addEventListener('click',function(e){
  var b=e.target.closest('.crow[data-name]'); if(!b) return;
  app.cand = app.cand===b.dataset.name ? null : b.dataset.name;
  renderSwap();
});
document.getElementById('swapReset').addEventListener('click',function(){
  app.pick=null; app.cand=null; renderSwap();
});
document.getElementById('genTemp').addEventListener('click',function(){
  setSchedule(generateTemp()); renderAll();
});
document.getElementById('clearSched').addEventListener('click',function(){
  setSchedule([]); app.pick=null; app.cand=null; renderAll();
});

if(window.innerWidth<640 && load('view',null)===null) app.view='list';
boot();
</script>
</body>
